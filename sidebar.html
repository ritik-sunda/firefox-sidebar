<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>My Sidebar</title>
  <link rel="stylesheet" href="sidebar.css">
  <script src="sidebar.js" defer></script>
</head>

<body>
  <aside class="sidebar">
    <h1>My Sidebar</h1>

    <details class="appearance-panel">
      <summary>Appearance</summary>

      <div class="theme-settings">
        <label for="theme-select">Theme</label>

        <select id="theme-select">
          <option value="default">Default</option>
          <option value="ocean">Ocean</option>
          <option value="custom">Custom</option>
        </select>

        <div id="custom-theme-controls" hidden>
          <label for="custom-background">Sidebar background</label>
          <input id="custom-background" type="color" value="#202331">
          <label>
            <input id="custom-gradient-enabled" type="checkbox">
            Enable colour glow
          </label>

          <label for="custom-glow">Glow colour</label>
          <input id="custom-glow" type="color" value="#7c3aed">
        </div>
      </div>
    </details>

    <div id="groups-container"></div>
    <label for="pin-group">Group for new pins</label>

    <select id="pin-group"></select>
    <button class="add-pin" type="button">New pin</button>
  </aside>
</body>

</html>
