<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>My Sidebar</title>
  <link rel="stylesheet" href="sidebar.css">
  <script src="sidebar.js" defer></script>
</head>

<body>
  <aside class="sidebar">
    <h1>My Sidebar</h1>
    <div class="theme-settings">
      <label for="theme-select">Theme</label>

      <select id="theme-select">
        <option value="default">Default</option>
        <option value="ocean">Ocean</option>
        <option value="custom">Custom</option>
      </select>

      <div id="custom-theme-controls" hidden>
        <label for="custom-background">Sidebar background</label>
        <input id="custom-background" type="color" value="#202331">
      </div>
    </div>

    <div id="groups-container"></div>
    <label for="pin-group">Group for new pins</label>

    <select id="pin-group"></select>
    <button class="add-pin" type="button">New pin</button>
  </aside>
</body>

</html>
